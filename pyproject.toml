[project]
name = "job-application-tracker-mcp"
version = "1.0.0"
description = "A local MCP server that tracks job applications in Notion."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.30,<2.0",
    "httpx>=0.28,<1.0",
    "python-dotenv>=1.1,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
